<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"
    />
    <title>AetherCore</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0a09;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        /* left/top/width/height are set by render/canvas.js to letterbox 16:9 */
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
